name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc --build also produces dist/, so a broken build fails here too.
      - run: npm run typecheck

      - run: npm run lint

      - run: npm run knip

      - run: npm run build

      - run: npm test

